version: "3.8"

services:
  # 1. Customer Storefront
  customer-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.customer-web
    container_name: bagodi-customer-web
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - bagodi-network

  # 2. Merchant Operations Portal
  merchant-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.merchant-admin
    container_name: bagodi-merchant-admin
    restart: unless-stopped
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
    networks:
      - bagodi-network

  # 3. Super Admin Governance
  super-admin:
    build:
      context: .
      dockerfile: docker/Dockerfile.super-admin
    container_name: bagodi-super-admin
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - NODE_ENV=production
    networks:
      - bagodi-network

  # 4. Reverse Proxy Gateway
  gateway:
    image: nginx:1.25-alpine
    container_name: bagodi-nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - customer-web
      - merchant-admin
      - super-admin
    networks:
      - bagodi-network

networks:
  bagodi-network:
    driver: bridge

